version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: django-backend:latest
    container_name: django_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nextjs-frontend:latest
    container_name: nextjs_frontend
    restart: always
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
