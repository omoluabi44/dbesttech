server {
    listen 80;
    server_name dbestquiz.com www.dbestquiz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dbestquiz.com www.dbestquiz.com;

    ssl_certificate /etc/letsencrypt/live/dbestquiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbestquiz.com/privkey.pem;

    # Basic SSL configs
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;

    # Django Admin and API
    location ~ ^/(api|django-admin) {
        proxy_pass http://django_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static Files
    location /static/ {
        proxy_pass http://django_backend:8000/static/;
        proxy_set_header Host $host;
    }

    # Django Media Files
    location /media/ {
        proxy_pass http://django_backend:8000/media/;
        proxy_set_header Host $host;
    }

    # Next.js Frontend
    location / {
        proxy_pass http://nextjs_frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
