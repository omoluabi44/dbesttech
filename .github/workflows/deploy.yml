name: Deploy to AWS (EC2 & Docker Hub)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: omoluabi44/primary-secondary-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: omoluabi44/primary-secondary-frontend:latest

  deploy:
    name: Deploy to Single EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Copy docker-compose and nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/"
          target: "/home/ec2-user/project"

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACKEND_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/project
            sudo docker-compose -f docker-compose.prod.yml down
            sudo docker system prune -af --volumes
            sudo docker-compose -f docker-compose.prod.yml pull
            sudo docker-compose -f docker-compose.prod.yml up -d
            
            echo "Waiting for services to start..."
            sleep 10
            sudo docker-compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput || true
            sudo docker-compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput || true
