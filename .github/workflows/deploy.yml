name: Deploy to AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_FRONTEND_REPOSITORY: django-nextjs-app-frontend
  ECR_BACKEND_REPOSITORY: django-nextjs-app-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker tag $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

      - name: Build, tag, and push frontend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG -f frontend/Dockerfile ./frontend
          docker tag $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 Instances via AWS Systems Manager (SSM)
        run: |
          # Encode files to base64 to safely pass them through the SSM command JSON payload
          DOCKER_COMPOSE_B64=$(base64 -w 0 docker-compose.yml)
          NGINX_CONF_B64=$(base64 -w 0 nginx/default.conf)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          # Replace the local image names in docker-compose.yml with ECR URIs
          # We'll use sed on the EC2 instance to do this securely
          
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=django-nextjs-app-asg-instance" \
            --parameters '{"commands":["mkdir -p /app/nginx","echo \"'$DOCKER_COMPOSE_B64'\" | base64 -d > /app/docker-compose.yml","echo \"'$NGINX_CONF_B64'\" | base64 -d > /app/nginx/default.conf","cd /app","sed -i \"s|image: django-backend:latest|image: '$ACCOUNT_ID'.dkr.ecr.us-east-1.amazonaws.com/django-nextjs-app-backend:latest|g\" docker-compose.yml","sed -i \"s|image: nextjs-frontend:latest|image: '$ACCOUNT_ID'.dkr.ecr.us-east-1.amazonaws.com/django-nextjs-app-frontend:latest|g\" docker-compose.yml","aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin '$ACCOUNT_ID'.dkr.ecr.us-east-1.amazonaws.com","docker-compose pull","docker-compose up -d --remove-orphans"]}' \
            --timeout-seconds 600 \
            --max-concurrency "50" \
            --max-errors "0" \
            --region us-east-1
