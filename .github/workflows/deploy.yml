name: Deploy to AWS (EC2 & Docker Hub)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: omoluabi44/primary-secondary-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: omoluabi44/primary-secondary-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.dbestquiz.com/api

  deploy-backend:
    name: Deploy Backend to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Copy docker-compose to Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.backend.yml"
          target: "/home/ec2-user"

      - name: SSH and Deploy Backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACKEND_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cp /home/ec2-user/docker-compose.backend.yml /app/
            cd /app
            sudo echo "${{ secrets.BACKEND_ENV_FILE }}" > .env
            sudo docker-compose -f docker-compose.backend.yml down
            sudo docker system prune -af --volumes
            sudo docker-compose -f docker-compose.backend.yml pull
            sudo docker-compose -f docker-compose.backend.yml up -d
            
            echo "Waiting for backend to start..."
            sleep 10
            sudo docker-compose -f docker-compose.backend.yml exec -T backend python manage.py collectstatic --noinput || true
            sudo docker-compose -f docker-compose.backend.yml exec -T backend python manage.py migrate --noinput || true

  deploy-frontend:
    name: Deploy Frontend to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Copy docker-compose to Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FRONTEND_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.frontend.yml"
          target: "/home/ec2-user"

      - name: SSH and Deploy Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FRONTEND_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cp /home/ec2-user/docker-compose.frontend.yml /app/
            cd /app
            sudo docker-compose -f docker-compose.frontend.yml down
            sudo docker system prune -af --volumes
            sudo docker-compose -f docker-compose.frontend.yml pull
            sudo docker-compose -f docker-compose.frontend.yml up -d
